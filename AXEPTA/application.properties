# --- Axepta ---
# Reprenez les URL exactes de votre documentation / espace marchand Axepta (sandbox puis prod)
axepta.token-uri=https://URL-AXEPTA/oauth/token
axepta.base-url=https://URL-API-AXEPTA
axepta.client-id=${AXEPTA_CLIENT_ID}
axepta.client-secret=${AXEPTA_CLIENT_SECRET}
# BASIC = identifiants dans le header Authorization ; POST = identifiants dans le corps
axepta.client-auth-method=BASIC
# scope optionnel, laisser vide si Axepta n'en demande pas
axepta.scope=
# renouveler le token X secondes avant son expiration
axepta.expiry-margin-seconds=60