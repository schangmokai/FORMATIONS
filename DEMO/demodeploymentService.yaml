kind: Deployment
apiVersion: apps/v1
metadata:
  name: demodeploy
spec:
  replicas: 4
  selector:
    matchLabels:
      app: monfront
  template:
    metadata:
      labels:
        app: monfront
    spec:
      containers:
      - image: nginx:1.16  # suivante 1.17
        imagePullPolicy: Always
        name: podfront
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: 500M
            cpu: 0.1
          limits:
            memory: 1G
            cpu: 1
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
