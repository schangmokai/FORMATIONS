apiVersion: v1
kind: Pod
metadata:
  name: demopodpvpvcnfs
spec:
  containers:
  - name: pvpvcnfsnginx
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - mountPath: "/usr/share/nginx/html"
      name: monstorage
  volumes:
  - name: monstorage
    persistentVolumeClaim:
      claimName: demopvcnfs
