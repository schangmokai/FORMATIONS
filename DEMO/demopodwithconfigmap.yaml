kind: Pod
apiVersion: v1
metadata:
  name: demopodwithconfigmap
spec:
  containers:
  - name: podnginxwithconfigmap
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - mountPath: "/usr/share/nginx/html"
      name: monstorage
  volumes:
  - name: monstorage
    configMap:
      name: springbootconfig
