kind: Pod
apiVersion: v1
metadata:
  name: demopodpvpvc
spec:
  containers:
  - name: monnginx
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - mountPath: "/usr/share/nginx/html"
      name: monstorage
  volumes:
  - name: monstorage
    persistentVolumeClaim:
      claimName: demopvc

