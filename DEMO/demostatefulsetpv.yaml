apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv0
spec:
  storageClassName: manual
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/pvdata0"

